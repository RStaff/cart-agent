name: security-ci

on:
  push:
    branches:
      - main
      - history-clean
      - develop
      - "**"
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          bin_dir="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$bin_dir"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$bin_dir" gitleaks
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Secret scan control regressions
        run: bash scripts/ci/test-secret-scan-control.sh

      - name: Gitleaks scan
        env:
          SECRET_SCAN_EVENT_NAME: ${{ github.event_name }}
          SECRET_SCAN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SECRET_SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SECRET_SCAN_DEFAULT_BRANCH_REF: origin/${{ github.event.repository.default_branch }}
          SECRET_SCAN_DEFAULT_BRANCH_NAME: ${{ github.event.repository.default_branch }}
          SECRET_SCAN_REF_NAME: ${{ github.ref_name }}
        run: bash scripts/ci/run-secret-scan.sh

  root-install-and-audit:
    name: Root install + audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root deps
        run: npm install

      - name: Root audit
        run: npm audit --audit-level=high || true

      - name: Merge marker guard
        run: bash scripts/block-merge-markers.sh
