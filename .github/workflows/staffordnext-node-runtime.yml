name: StaffordNext Node runtime

on:
  push:
    branches:
      - security/staffordnext-node24-20261027
    paths:
      - ".github/workflows/staffordnext-node-runtime.yml"
      - "staffordos/ui/operator-frontend/careeros-beta/**"
  pull_request:
    paths:
      - ".github/workflows/staffordnext-node-runtime.yml"
      - "staffordos/ui/operator-frontend/careeros-beta/**"

permissions:
  contents: read

jobs:
  node-24-production-rehearsal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: careeros_node24
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d careeros_node24"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: staffordos/ui/operator-frontend/careeros-beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: staffordos/ui/operator-frontend/careeros-beta/package-lock.json
      - name: Install like production
        run: npm ci --omit=optional --no-audit --no-fund
      - name: Verify resolved and installed dependencies
        run: |
          node scripts/assert-node-version.mjs
          npm ls next react react-dom --all
          node -e 'const lock=require("./package-lock.json"); const sharp=lock.packages["node_modules/sharp"]?.version; if(sharp!=="0.35.5") throw new Error(`SHARP_LOCK_MISMATCH ${sharp}`); try { require.resolve("sharp"); throw new Error("SHARP_SHOULD_BE_OMITTED"); } catch(error) { if(error.message==="SHARP_SHOULD_BE_OMITTED") throw error; }'
      - name: Build
        run: npm run build
      - name: Focused application and authorization tests
        run: node --test lib/career/*.test.mjs scripts/*.test.mjs
      - name: Enable disposable PostgreSQL TLS
        run: |
          pg_container="$(docker ps -q --filter ancestor=postgres:17)"
          test -n "$pg_container"
          docker exec -u 0 "$pg_container" sh -lc 'openssl req -new -x509 -days 1 -nodes -subj /CN=localhost -out /var/lib/postgresql/server.crt -keyout /var/lib/postgresql/server.key >/dev/null 2>&1 && chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key && chmod 600 /var/lib/postgresql/server.key'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET ssl_cert_file='/var/lib/postgresql/server.crt'" \
            -c "ALTER SYSTEM SET ssl_key_file='/var/lib/postgresql/server.key'" \
            -c "ALTER SYSTEM SET ssl='on'" \
            -c "SELECT pg_reload_conf()"
          test "$(psql "$DATABASE_URL" -Atc 'SHOW ssl')" = on
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/careeros_node24
      - name: Rehearse accepted startup against PostgreSQL 17
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/careeros_node24
          NODE_ENV: production
          PORT: "3100"
          CAREEROS_APP_ORIGIN: http://127.0.0.1:3100
          CAREEROS_SESSION_PEPPER: disposable-validation-only
          CAREEROS_INVITE_ONLY: "true"
        run: |
          for migration in \
            20260816000000_careeros_p0_foundation \
            20260817000000_careeros_capability_match_product \
            20260817010000_add_career_story_status \
            20260817020000_add_opportunity_decision_state; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "prisma/migrations/$migration/migration.sql"
          done
          npm start > /tmp/staffordnext-node24-startup.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100/career/login >/dev/null; then break; fi
            test "$attempt" -lt 60
            sleep 1
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/career/login)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/career/profile)" = 401
          kill "$app_pid"
          wait "$app_pid" || true
